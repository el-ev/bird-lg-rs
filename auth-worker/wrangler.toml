name = "dn42-auth"
main = "src/index.ts"
compatibility_date = "2026-04-18"
compatibility_flags = ["nodejs_compat"]
workers_dev = false

[[routes]]
pattern = "dn42-auth.owo.li"
custom_domain = true

[observability]
enabled = true
head_sampling_rate = 1

[assets]
directory = "./public"
run_worker_first = ["/v1/*", "/health", "/config.json", "/openapi.json", "/swagger", "/swagger/", "/oidc/*", "/auth/*", "/login/*"]

# Secrets: KIOUBIT_OIDC_CLIENT_SECRET, IEDON_OIDC_CLIENT_SECRET, RESEND_API_KEY, DN42_GIT_TOKEN
[vars]
DN42_REGISTRY_OWNER = "dn42"
DN42_REGISTRY_REPO = "registry"
DN42_REGISTRY_BRANCH = "master"
DN42_REGISTRY_BASE_URL = "https://git.dn42.dev"
HOST_ASNS = "4242421023"
AUTH_SITE_URL = "https://dn42-auth.owo.li"
ALLOWED_RETURN_URLS = "https://dn42.moe,https://autopeer.owo.li"
OIDC_PROVIDERS = """[
  {
    "name": "kioubit",
    "label": "Kioubit",
    "issuer": "https://dn42.g-load.eu",
    "client_id": "94c84c63-1efd-451b-80f4-5bc88123f2c5",
    "client_secret_env": "KIOUBIT_OIDC_CLIENT_SECRET",
    "token_endpoint_auth_method": "client_secret_post",
    "audience": "94c84c63-1efd-451b-80f4-5bc88123f2c5",
    "scopes": ["openid", "profile", "email", "dn42"],
    "asn_claim": "dn42.asn",
    "mntner_claim": "dn42.mnt",
    "description": "Authenticate with Kioubit."
  },
  {
    "name": "iedon",
    "label": "iEdon",
    "issuer": "https://auth.iedon.net",
    "dn42_issuer": "https://oauth.dn42",
    "client_id": "5fd911be16a3859f0f6603f0cd9e5181",
    "client_secret_env": "IEDON_OIDC_CLIENT_SECRET",
    "token_endpoint_auth_method": "client_secret_post",
    "audience": "5fd911be16a3859f0f6603f0cd9e5181",
    "scopes": ["openid", "profile", "email", "dn42"],
    "asn_claim": "dn42.asn",
    "mntner_claim": "dn42.active_mnt",
    "description": "Authenticate with iEdon."
  }]"""

[[d1_databases]]
binding = "DB"
database_name = "bird-lg-autopeer"
database_id = "cc93aafe-066c-4fef-80b5-d62e5db42522"
