[package]
name = "frontend"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
chrono = { version = "0.4.42", features = ["serde"] }
common = { path = "../common" }
futures = "0.3"
gloo-net = "0.6"
gloo-storage = "0.3.0"
ipnet = "2.11.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1.43"
tracing-wasm = "0.2.1"
ui_components = { package = "components", path = "../components" }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "Document",
    "DomRect",
    "DomTokenList",
    "Element",
    "Event",
    "EventSource",
    "History",
    "HtmlInputElement",
    "HtmlSelectElement",
    "HtmlTextAreaElement",
    "KeyboardEvent",
    "Location",
    "MessageEvent",
    "Range",
    "Selection",
    "Window",
] }
yew = { version = "0.21", features = ["csr"] }
yew-router = "0.18"
