[package]
name = "autopeer"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
common = { path = "../common" }
gloo-net = "0.6"
gloo-timers = { version = "0.3", features = ["futures"] }
js-sys = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ui_components = { package = "components", path = "../components" }
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Clipboard", "Crypto", "HtmlSelectElement", "HtmlTextAreaElement", "Navigator", "Storage", "UrlSearchParams", "Window"] }
yew = { version = "0.21", features = ["csr"] }
