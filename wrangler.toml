name = "bird-lg-web"
main = "worker/build/worker/shim.mjs"
compatibility_date = "2025-12-03"
keep_vars = true
workers_dev = false
preview_urls = false

[build]
command = "cd frontend && trunk build --release -M && cd ../worker && cargo install -q worker-build && worker-build --release"
cwd = "."
watch_dir = [
    "frontend/src",
    "frontend/assets",
    "frontend/index.html",
    "autopeer/src",
    "components/src",
    "worker/src",
]

[assets]
directory = "frontend/dist"
binding = "ASSETS"

[vars]
# BACKEND_URL = "https://127.0.0.1:3000"
# AUTOPEER_URL = "https://127.0.0.1:3001"
# AUTOPEER_SITE_URL = "https://127.0.0.1:8788/autopeer"
# LOOKING_GLASS_URL = "https://127.0.0.1:8788/"
# USERNAME = "iris"
