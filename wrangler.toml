name = "bird-lg-web"
main = "worker/build/worker/shim.mjs"
compatibility_date = "2025-12-03"
keep_vars = true
workers_dev = false
preview_urls = false

[[routes]]
pattern = "network.owo.li"
zone_name = "owo.li"
custom_domain = true

[build]
command = "cd frontend && trunk build --release -M && cd ../worker && cargo install -q worker-build && worker-build --release"
cwd = "."
watch_dir = [
    "frontend/src",
    "frontend/assets",
    "frontend/index.html",
    "autopeer/src",
    "components/src",
    "worker/src",
]

[assets]
directory = "frontend/dist"
binding = "ASSETS"

[vars]
AUTOPEER_SITE_URL = "https://autopeer.owo.li"
BACKEND_URL = "https://lg-api.svc.moe"
USERNAME = "iris"
